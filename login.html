<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Entrar · Malleus Maleficarum</title>
  <meta name="description" content="Acesso à mesa da campanha Malleus Maleficarum.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilizacao/login/login.css">
  <link rel="icon" type="image/png" href="img/Igreja.png">
  <link rel="shortcut icon" type="image/png" href="img/Igreja.png">

  <link rel="canonical" href="https://malleus.duqueiguro.xyz/login.html">
  <meta name="author" content="Duque Iguro">
  <meta name="theme-color" content="#1a1008">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Malleus Maleficarum">
  <meta property="og:title" content="Entrar · Malleus Maleficarum">
  <meta property="og:description" content="Acesso à mesa da campanha Malleus Maleficarum.">
  <meta property="og:url" content="https://malleus.duqueiguro.xyz/login.html">
  <meta property="og:image" content="https://malleus.duqueiguro.xyz/img/Igreja.png">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Entrar · Malleus Maleficarum">
  <meta name="twitter:description" content="Acesso à mesa da campanha Malleus Maleficarum.">
  <meta name="twitter:image" content="https://malleus.duqueiguro.xyz/img/Igreja.png">
</head>
<body>

<div class="fundo" aria-hidden="true"></div>

<main class="cartao">
  <a class="voltar" href="index">← Portal</a>

  <header class="cabeca">
    <div class="cruz" aria-hidden="true">✠</div>
    <h1>Entrar</h1>
    <p class="subtitulo">Acesso à mesa</p>
  </header>

  <form id="form-login" class="form" novalidate>
    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email"
             autocomplete="username" inputmode="email"
             autocapitalize="none" spellcheck="false" required>
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <div class="campo-senha">
        <input id="senha" name="senha" type="password"
               autocomplete="current-password" required>
        <button type="button" id="mostrar-senha" class="mostrar"
                aria-pressed="false" aria-controls="senha">Mostrar</button>
      </div>
    </div>

    <p id="erro" class="erro" role="alert" hidden></p>

    <button type="submit" id="entrar" class="btn-entrar">
      <span class="texto-botao">Entrar</span>
    </button>
  </form>

  <p class="ajuda">
    Não tem acesso? Peça ao mestre.
    Esqueceu a senha? O mestre pode redefini-la.
  </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="estilizacao/login/login.js" defer></script>
</body>
</html>
